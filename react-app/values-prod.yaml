replicaCount: 4

image:
  repository: react-clean
  tag: prod
  pullPolicy: Never

service:
  type: ClusterIP
  port: 80
  targetPort: 80
  nodePort: null

ingress:
  enabled: true
  className: nginx
  host: prod.local
  path: /
  pathType: Prefix

env:
  APP_ENV: production

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m